# Ruff configuration for the backend.
#
# Without this file ruff applies whatever its current release defaults to,
# which drifts between versions: on ruff 0.16 a bare `ruff check` reports
# ~632 findings, almost all stylistic. CI runs this gate, so that drift
# silently turns the lint gate into a wall.
#
# The selected set below is the historical ruff default (pyflakes + the
# error-class pycodestyle rules) - the correctness-oriented subset. It is
# fully clean for `app/` (since 2026-08-05) and for `tests/` (since
# 2026-11-23, audit 53.162), and CI gates exactly those two:
# `ruff check app/ tests/`.
#
# `scripts/` is the one directory still outside the gate: it reports 19
# findings under this set (7 F541, 6 F401, 4 E402, 2 E741 as of 2026-11-23),
# so a bare `ruff check .` still fails. The 318-test debt in tests/ was paid
# down one family at a time - F811/F841/F403 first (audit 53.161), then
# F401/F541/E402 plus the last two stragglers (audit 53.162) - which is why
# the per-family `--select` step 53.161 added no longer exists: it was a
# scaffold for the debt, and the debt is gone. Widen to `scripts/` the same
# way, one family at a time, rather than by upgrading ruff.

line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
