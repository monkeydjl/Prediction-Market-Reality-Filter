# Ruff configuration for the backend.
#
# Without this file ruff applies whatever its current release defaults to,
# which drifts between versions: on ruff 0.16 a bare `ruff check` reports
# ~632 findings, almost all stylistic. CI runs this gate, so that drift
# silently turns the lint gate into a wall.
#
# The selected set below is the historical ruff default (pyflakes + the
# error-class pycodestyle rules) - the correctness-oriented subset. Every
# tracked directory in this tree is clean under it: `app/` since 2026-08-05,
# `tests/` since audit 53.162, `scripts/` since audit 53.163. CI therefore
# runs the plain `ruff check .` with no path arguments and no exceptions.
#
# The debt in `tests/` was paid down one family at a time - F811/F841/F403
# first (audit 53.161), then F401/F541/E402 plus two stragglers (53.162),
# then `scripts/` (53.163). The per-family `--select` step that 53.161 added
# is gone: it was a scaffold for the debt, and a scaffold that outlives its
# debt reads as a permanent constraint. Widen this way - one family at a
# time, never by upgrading ruff.

line-length = 100

# Scratch directories that are gitignored and never reach CI. Ruff's
# `respect-gitignore` did not skip them here (measured, not assumed), so a
# bare `ruff check .` failed locally on probe files a developer had left
# behind while CI stayed green - the worst kind of asymmetry. Excluding them
# explicitly makes the two runs agree. `.workbench/` is 107 throwaway probe
# scripts; `backend/` inside `backend/` is a stray copy of two check scripts.
extend-exclude = [".workbench", "backend"]

[lint]
select = ["E4", "E7", "E9", "F"]
