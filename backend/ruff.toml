# Ruff configuration for the backend.
#
# Without this file ruff applies whatever its current release defaults to,
# which drifts between versions: on ruff 0.16 a bare `ruff check app/` reports
# ~632 findings, almost all stylistic. CI runs `ruff check app/`, so that drift
# silently turns the lint gate into a wall.
#
# The selected set below is the historical ruff default (pyflakes + the
# error-class pycodestyle rules) - the correctness-oriented subset. It is fully
# clean as of 2026-08-05. Widen it deliberately, one rule family at a time,
# rather than by upgrading ruff.

line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
