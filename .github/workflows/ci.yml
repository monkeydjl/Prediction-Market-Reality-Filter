name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install dev dependencies
        run: python -m pip install ruff pytest pytest-cov mypy
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Lint backend
        run: ruff check app/
      - name: Compile backend
        run: python -m compileall app tests
      # Non-blocking baseline (P-16): ~256 pre-existing errors, mostly
      # SQLAlchemy Column friction. Tighten incrementally until this can be
      # flipped to a blocking gate.
      - name: Type-check backend (mypy, non-blocking baseline)
        run: mypy app/ --config-file mypy.ini
        continue-on-error: true
      - name: Run backend tests with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  type-sync-check:
    name: Type Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dev deps
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install json2ts (frontend deps)
        run: cd frontend && npm ci
      - name: Check type sync
        run: cd backend && python -m scripts.generate_types --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
