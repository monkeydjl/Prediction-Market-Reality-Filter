name: CI

# An unfiltered `push:` alongside `pull_request:` runs the whole matrix twice
# for every PR commit — the branch push fires one set and the PR fires an
# identical set against the same tree, which cost an extra ~7.5 min backend
# suite per push. Restricting push to main keeps merge-commit coverage while
# letting pull_request own everything on a topic branch.
on:
  push:
    branches: [main]
  pull_request:

# Supersede stale PR runs: force-pushing or stacking commits otherwise leaves
# obsolete runs racing to completion. Never cancel a main run — every merge
# commit should get a verdict of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the checkout. Without this block the workflow
# inherits the repository's default GITHUB_TOKEN scope, which can be
# read/write on contents, issues and packages.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      # requirements-dev.txt carries the pinned pytest/pytest-asyncio/mypy the
      # suite is verified against. Installing pytest unpinned here previously
      # omitted pytest-asyncio, which made every `async def test_` (20 files)
      # fail with "async def functions are not natively supported".
      # ruff and pytest-cov are CI-only, so they stay explicit.
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt ruff==0.16.1 pytest-cov
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Lint backend
        run: ruff check app/
      - name: Compile backend
        run: python -m compileall app tests
      # mypy is clean and now BLOCKING: `app/` type-checks with zero errors
      # under backend/mypy.ini as of 2026-08-14, so any new error fails the
      # build. This replaced a ratchet (`MYPY_ERROR_CEILING`, hand-lowered from
      # 627 through 19 across PRs #10–#19), which in turn replaced a bare
      # `continue-on-error: true` that let the count grow forever because a
      # failure annotation is easy to ignore when nothing actually fails.
      #
      # Do not reintroduce a ceiling to land a red build. A local run
      # reproduces this job exactly (`cd backend && python -m mypy app/
      # --config-file mypy.ini`; on Windows prefix `PYTHONUTF8=1`), and the
      # result no longer depends on the platform.
      #
      # mypy.ini has no leniency knobs left beyond `ignore_missing_imports`
      # (which has to stay, so the run reproduces on a machine that installed
      # only requirements.txt). warn_unused_ignores went on in PR #21 — a stale
      # `type: ignore` fails the build now, so delete one rather than re-adding
      # it "just in case" — check_untyped_defs in PR #22, so the body of an
      # un-annotated function is checked like any other, and
      # disallow_untyped_defs last, which means a new function without a return
      # annotation fails the build. Annotate it; do not turn the knob back off.
      - name: Type-check backend (mypy)
        run: mypy app/ --config-file mypy.ini
      - name: Run backend tests with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  type-sync-check:
    name: Type Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dev deps
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install json2ts (frontend deps)
        run: cd frontend && npm ci
      - name: Check type sync
        run: cd backend && python -m scripts.generate_types --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
