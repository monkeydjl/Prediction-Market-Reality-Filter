version: "3.9"

services:
  pmrf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pmrf
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - pmrf_data:/app/backups
      - pmrf_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pmrf_data:
  pmrf_logs:
