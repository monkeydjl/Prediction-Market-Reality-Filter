[mypy]
# Lenient baseline configuration (see docs/reviews/pending-issues-2026-06-27.md,
# item P-16). CI ratchets rather than blocks: the `Type-check backend` step in
# .github/workflows/ci.yml fails only when the count exceeds
# MYPY_ERROR_CEILING, so the pre-existing baseline can be paid down
# incrementally. Re-derive the count rather than trusting any number written in
# a comment:
#   cd backend && python -m mypy app/ --config-file mypy.ini | tail -1
# The baseline used to be dominated by two clusters, both now closed.
#   1. SQLAlchemy legacy `Column[str]` vs `str`: 627 -> 292. No `Column[...]`
#      errors remain and no `= Column(` survives under `app/` — new models use
#      `Mapped[T]` / `mapped_column()` with an explicit `nullable=`, and belong
#      in one of the shape tests (`tests/test_kernel_db_model_shape.py`,
#      `tests/test_world_cup_prediction_model_shape.py`).
#   2. `object`-typed proxies and result dicts: 292 -> 207. Dispatch proxies
#      (`MultiAdapter`, `MultiFeatureBuilder`) hold their `DataAdapter` /
#      `FeatureBuilder` Protocol from `app/kernel/protocols.py` rather than
#      `object`; row helpers that forward to `Session.get` are generic over
#      `type[_RowT]`; and heterogeneous `results = {...}` accumulators carry an
#      explicit `dict[str, Any]`. `grep '"object" has no attribute'` over the
#      output is empty — don't reintroduce `object` as a stand-in for a Protocol.
#   3. Per-file sweep of the worst offenders: 207 -> 126, nine files that each
#      carried 6-14 errors. Mostly Optional narrowing, but two of them were live
#      bugs the annotations exposed: `kalshi_sports_source` read the
#      `SportMarketInfo` dataclass as a mapping (AttributeError swallowed by a
#      blanket `except`, so the Kalshi sports feed always emitted zero
#      candidates), and `/analytics/odds-cache-stats` subtracted SQLite's naive
#      `cached_at` from an aware `now` (500 on any non-empty cache table). Both
#      have regression tests; the four tests that mocked the detector with a
#      plain dict were passing vacuously and were rewritten.
#   4. The 6-error tier: 126 -> 98, five files. Four were the same two shapes as
#      cluster 3 (heterogeneous dict literals annotated `dict[str, Any]`, and
#      `float(d.get(k))` replaced by a `-> float | None` parse helper). The
#      fifth was platform-dependent: `os.name == "nt"` around the `msvcrt` /
#      `fcntl` lock calls in `app/core/scheduler.py` and `app/utils/file_store.py`.
#      mypy prunes a platform branch only for `sys.platform`, so under `os.name`
#      both branches were checked and every attribute in the inactive one looked
#      undefined. That made the count platform-dependent (Windows and CI
#      disagreed); after the swap a local run matches CI exactly, which is worth
#      preserving — `grep 'os.name ==' app/` should stay empty.
# What is left is ordinary `Optional` narrowing, dict/`Any` looseness and a few
# third-party stub gaps, spread thin across ~46 files, no file above 5 errors.
# Tighten further by removing error-code disables and flipping the step to
# blocking once the ceiling reaches 0.

# app/ uses implicit namespace packages (no __init__.py in app/, app/api/,
# app/services/). explicit_package_bases lets mypy resolve two same-named
# modules (e.g. app.api.audit_metadata vs app.services.audit_metadata)
# instead of aborting with "Duplicate module named ...".
explicit_package_bases = True

# Third-party stubs (fastapi, sqlalchemy, apscheduler, ...) may be absent;
# don't fail the run on missing stubs during the baseline phase.
ignore_missing_imports = True

# Keep noise low while the baseline is being paid down.
warn_unused_ignores = False
warn_redundant_casts = False

# Preserve useful defaults: no_implicit_optional, check_untyped_defs=False.
