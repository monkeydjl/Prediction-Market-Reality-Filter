[mypy]
# `app/` type-checks CLEAN under this config, and the `Type-check backend` step
# in .github/workflows/ci.yml is BLOCKING as of 2026-08-14 (see
# docs/reviews/pending-issues-2026-06-27.md, item P-16, for where the baseline
# came from). Re-derive rather than trusting any number written in a comment:
#   cd backend && python -m mypy app/ --config-file mypy.ini | tail -1
# The 627-error baseline was paid down in eleven passes across PRs #10-#22. The
# history below is kept because each pass names a *shape* that recurred, and
# most of them recurred more than once — read it before adding an annotation or
# a `type: ignore`.
# The baseline used to be dominated by two clusters, both now closed.
#   1. SQLAlchemy legacy `Column[str]` vs `str`: 627 -> 292. No `Column[...]`
#      errors remain and no `= Column(` survives under `app/` — new models use
#      `Mapped[T]` / `mapped_column()` with an explicit `nullable=`, and belong
#      in one of the shape tests (`tests/test_kernel_db_model_shape.py`,
#      `tests/test_world_cup_prediction_model_shape.py`).
#   2. `object`-typed proxies and result dicts: 292 -> 207. Dispatch proxies
#      (`MultiAdapter`, `MultiFeatureBuilder`) hold their `DataAdapter` /
#      `FeatureBuilder` Protocol from `app/kernel/protocols.py` rather than
#      `object`; row helpers that forward to `Session.get` are generic over
#      `type[_RowT]`; and heterogeneous `results = {...}` accumulators carry an
#      explicit `dict[str, Any]`. `grep '"object" has no attribute'` over the
#      output is empty — don't reintroduce `object` as a stand-in for a Protocol.
#   3. Per-file sweep of the worst offenders: 207 -> 126, nine files that each
#      carried 6-14 errors. Mostly Optional narrowing, but two of them were live
#      bugs the annotations exposed: `kalshi_sports_source` read the
#      `SportMarketInfo` dataclass as a mapping (AttributeError swallowed by a
#      blanket `except`, so the Kalshi sports feed always emitted zero
#      candidates), and `/analytics/odds-cache-stats` subtracted SQLite's naive
#      `cached_at` from an aware `now` (500 on any non-empty cache table). Both
#      have regression tests; the four tests that mocked the detector with a
#      plain dict were passing vacuously and were rewritten.
#   4. The 6-error tier: 126 -> 98, five files. Four were the same two shapes as
#      cluster 3 (heterogeneous dict literals annotated `dict[str, Any]`, and
#      `float(d.get(k))` replaced by a `-> float | None` parse helper). The
#      fifth was platform-dependent: `os.name == "nt"` around the `msvcrt` /
#      `fcntl` lock calls in `app/core/scheduler.py` and `app/utils/file_store.py`.
#      mypy prunes a platform branch only for `sys.platform`, so under `os.name`
#      both branches were checked and every attribute in the inactive one looked
#      undefined. That made the count platform-dependent (Windows and CI
#      disagreed); after the swap a local run matches CI exactly, which is worth
#      preserving — `grep 'os.name ==' app/` should stay empty.
#   5. The 5-error tier: 98 -> 76, five files. One more live bug: after
#      `asyncio.gather(..., return_exceptions=True)`, `_collect_candidate_events`
#      guarded with `isinstance(result, Exception)`, so a cancelled source's
#      `CancelledError` (a `BaseException`, not an `Exception`) was appended as a
#      result value and the `zip_longest` below tried to iterate it — one
#      cancelled source lost the whole event scan. Narrow on `BaseException`
#      after `gather`, always. The rest were narrowing shapes worth naming: a
#      bool flag assigned from `is not None` reads like a guard but does not
#      narrow the Optional (test the row, not the flag), `x = d.get(k) if
#      d.get(k) in (...) else default` narrows nothing because it calls `.get`
#      twice (coerce once, then test), and annotations are function-scoped, so
#      re-annotating a name an earlier branch already bound is `no-redef`.
#   6. The 4-error tier: 76 -> 56, five files. The `gather` guard was wrong a
#      *fourth* time, and live again: `auto_resolve_events` reached
#      `len(result)` on a cancelled source's `CancelledError` and lost the whole
#      auto-resolve pass. `max(d, key=d.get)` also recurred (use
#      `key=lambda k: d[k]`). Two new shapes: `x not in (None, 0.0)` does not
#      narrow an Optional (spell out `is not None and x != 0.0`), and a
#      module-level `_X = None` lazy singleton assigned inside an init function
#      cannot be narrowed at the callsite at all — annotate it
#      `T | None` and raise on the None branch, which also names the
#      half-initialized state instead of "'NoneType' object is not callable".
#      A dict-of-dicts search space became a `TypedDict` rather than
#      `dict[str, Any]`, since its three values have three different shapes.
#   7. The 3-error tier: 56 -> 36, six files (plus two 1-error files that fell
#      out of the same fix). The dead-capability defect again: the P1-F3 injury
#      fallback in `app/sports/football/adapters/_shared.py` imported
#      `world_cup_player_status_source.get_team_injury_impact`, which never
#      existed — the ImportError was swallowed by a bare `except Exception`, so
#      the World Cup fallback had never run. All four tests of that branch
#      patched the name with `create=True`, which invented the attribute and
#      hid the gap; the function is now implemented over the player-status
#      facts and the patches no longer pass `create=True`. Also: `hfa` / `k` in
#      `app/sports/_shared/elo_calculator.py` were annotated `int` while every
#      caller (EloParams, the parameter optimizer) tunes them as floats, which
#      alone accounted for 5 errors in 3 files — widening the annotation is the
#      fix, casting at the callsite would have truncated tuned values. The rest
#      were narrowing shapes already in this list: read `.get()` once before
#      testing it (`world_cup_team_stats_service`), don't branch on a bool flag
#      derived from `is not None` (`market_only_engine`), narrow the normalized
#      value rather than the column it came from (`world_cup_schedule_factors`,
#      via a walrus inside the comprehension), and annotate a `{"k": str,
#      **dict[str, int]}` literal `dict[str, Any]` or its values stay `object`
#      (`world_cup_group_context`).
#   8. The 2-error tier: 36 -> 19, all seven remaining 2-error files (plus a
#      1-error file that carried the same bug). The `gather`/`CancelledError`
#      guard was wrong a *fifth* and *sixth* time, both live and both losing
#      every source's data rather than one: `gnews_service.fetch_google_news`
#      (a cancelled query variant reached `articles.extend`, raising TypeError
#      inside the caller's blanket `except Exception`, so the whole news feed
#      silently emptied) and `sentiment_aggregator.fetch_rss_news` (identical
#      shape). Neither module had a unit test; both now have one that fails
#      without the fix. Two more shapes worth naming: a **predicate function**
#      cannot narrow its argument, so `if not _finite(x): continue` leaves
#      `float(x)` on the next line still Optional — return the parsed value
#      (`-> float | None`) instead of a bool, which also removes the second
#      parse; and one variable reused across if/else branches takes the *first*
#      branch's type, so `season = 2026` then `season = "2026"` made a str
#      reach a parameter declared `int` (`world_cup_match_service`). The rest:
#      thread validated ints into a fact builder rather than re-reading them
#      off a nullable column just written (`world_cup_verified_result_
#      correction_service`), check `is None` explicitly where an `isnot(None)`
#      query filter is the real guard (`historical_data_ingestor`), fall back to
#      a nullable column's own Python-side default rather than storing None in a
#      non-Optional dataclass field (`kernel/factor_registry`), and the
#      heterogeneous-dict-literal annotation again (`world_cup_factor_service`).
#   9. The 1-error tier: 19 -> 0, nineteen files, each its own investigation.
#      Four shapes already in this list accounted for most of it: the
#      two-`.get()` conditional (`world_cup_data_source_status_service`,
#      `nhl_stats_client`), the heterogeneous dict literal
#      (`kernel/futures_link_store`, `world_cup_weather_service` — where the
#      `dict[str, object]` was rejected by httpx's `params`, not by a later
#      write), a name reused across two containers in one function keeping the
#      first binding's type (`memory/event_store`), and a **predicate that
#      cannot narrow** (`evidence_aggregation_service._is_valid_index` ->
#      `_valid_index() -> int | None`, `model_eval_lab_service._is_real_number`
#      -> `_real_number() -> float | None`, the latter kept as a one-line
#      delegate for its two genuine bool callers). Also: a wrong `int`
#      annotation on a shared helper again — `hfa` in
#      `app/sports/basketball/elo_calculator.py`, the twin of the
#      `_shared/elo_calculator.py` fix in cluster 7, fed by a
#      `resolve_nba_hfa() -> float`; the ordinary-narrowing pattern of rejecting
#      the missing case before `float()` (`kernel/market_liquidity`,
#      `sports/_shared/team_geo`, where a `.get()` plus one post-join guard
#      replaced a None-check buried in one arm of an if/else); `float()` takes
#      `str | SupportsFloat`, so a raw dict value is `Any`, never `object`
#      (`sports/lol/feature_builder`); `Sequence[str] | None` for a parameter fed
#      by `csv.DictReader.fieldnames` (`world_cup_official_csv_source`); and
#      `return f(...)` where `f` returns None is `func-returns-value` — call,
#      then `return None` (`cross_validation_service`).
#      Three needed a `# type: ignore`, each with the reason inline: bs4
#      publishes no `find(name, string=...)` overload though it dispatches the
#      combination at runtime (its own "way too much code" TODO); rebinding a
#      *class* name to None in an `except ImportError` is `[misc]` on top of
#      `[assignment]` (`club_elo_service`); and a no-op stub for a *function*
#      must have a signature identical to the real one, which is impossible when
#      the real one is annotated with a type from the missing package
#      (`utils/metrics.generate_latest`). Two `name-defined` errors were the
#      same shape as each other: a return annotation naming a class that only a
#      function-body import provides, fixed with `if TYPE_CHECKING:` — which
#      keeps the import out of module scope *and* retires the `# noqa: F821`
#      (`api/routes/sport_odds`, `api/routes/sport_settlements`).
#  10. warn_unused_ignores turned on: 8 stale ignores in 5 files, 0 -> 0. None
#      was hiding a live error; each was dead for a reason worth knowing. Five
#      were vacuous because the value was already `Any`: `_get_kernel()` in
#      `app/api/routes/predictions.py` has no annotations, so `kernel._adapter`
#      is Any (`reveal_type` says so) and the `call-arg` / `attr-defined`
#      ignores on `sync_schedule(filters)` and `registered_prefixes()` never
#      fired - they become real again the day that function is annotated, which
#      is why the comment there now says what to do instead. Same for
#      `betting_catalog` (`getattr(kernel, "_adapter", None)`) and the three in
#      `app/sports/football/adapters/_shared.py`, whose `last_match_date`
#      parameter is `Any`. One was superseded by an earlier fix in this paydown:
#      `utils/sentry.is_enabled` guarded a `union-attr` that cannot occur,
#      because `sentry_sdk = None` in the `except ImportError` is itself
#      `# type: ignore[assignment]`, so the module type sticks. The last was
#      over-broad by one code: for a *function*, "conditional variants must have
#      identical signatures" is `[misc]` only, so the `[no-redef]` half of
#      `utils/metrics.generate_latest`'s ignore was dead the moment it was
#      written - class stubs need `[no-redef]`, function stubs need `[misc]`.
#      warn_redundant_casts went on in the same pass and costs nothing: there is
#      no `cast(` under app/ at all.
#  11. check_untyped_defs turned on: 7 errors in 3 files, 0 -> 0. Until this
#      pass mypy skipped the body of every un-annotated function and said so
#      only in an `[annotation-unchecked]` note (11 of them), so these lines
#      had never been checked by anything. Five were in one body -
#      `_get_kernel()` in `app/api/routes/predictions.py`, the same function
#      cluster 10 flagged - and three of those were cluster 2 again: the
#      adapter / builder registries were `dict[str, object]`, so `MultiAdapter`
#      and `MultiFeatureBuilder` were handed a dict of the wrong value type.
#      Annotating them `dict[str, DataAdapter]` / `dict[str, FeatureBuilder]`
#      (imported under `if TYPE_CHECKING`, since the kernel imports are
#      deliberately lazy) type-checks every registered adapter against the
#      Protocol - all of them already satisfied it. The other two were the
#      singleton cache hung on the function object as `_get_kernel._instance`:
#      mypy cannot model an attribute on a function at all, and the attribute
#      is the contract `reset_kernel_singleton()` and four test modules reach
#      for, so it stays - `setattr` to write and one annotated local
#      (`instance: PredictionKernel = getattr(...)`) to pin the Any on read.
#      The remaining two were shapes already in this list: a heterogeneous
#      per-engine accumulator needing `dict[str, dict[str, Any]]`
#      (`engine_comparison_service`), and a nested JSON payload list needing
#      `list[dict[str, Any]]` so a `str | int | None` stopped reaching
#      `dict.get` in a sort key (`world_cup_predictions`, where the sibling
#      route 500 lines above already carried exactly that annotation).
# One leniency knob is left: `disallow_untyped_defs`, 225 errors in 36 files
# (re-measured with check_untyped_defs on). The predictions.py entry in cluster
# 10 is a preview of it.

# app/ uses implicit namespace packages (no __init__.py in app/, app/api/,
# app/services/). explicit_package_bases lets mypy resolve two same-named
# modules (e.g. app.api.audit_metadata vs app.services.audit_metadata)
# instead of aborting with "Duplicate module named ...".
explicit_package_bases = True

# Third-party stubs (fastapi, sqlalchemy, apscheduler, ...) may be absent;
# don't fail the run on a missing stub. This is the one knob that should stay:
# the run has to be reproducible on a machine that installed only
# requirements.txt.
ignore_missing_imports = True

# A stale `type: ignore` is invisible once the run is clean, so this is on and
# the run has to stay clean under it. The eight it found are written up as
# cluster 10 in the header. warn_redundant_casts is the cheap twin (no `cast(`
# under app/ at all right now, so it costs nothing).
warn_unused_ignores = True
warn_redundant_casts = True

# The bodies of un-annotated functions are checked too, as of PR #22 (cluster 11
# in the header). Without this mypy skipped them silently and printed an
# `[annotation-unchecked]` note per site; there were 11 such notes and 7 real
# errors hiding under them. `grep annotation-unchecked` over the output should
# stay empty. disallow_untyped_defs (225 errors in 36 files) is the last knob.
check_untyped_defs = True

# Preserve useful defaults: no_implicit_optional.
